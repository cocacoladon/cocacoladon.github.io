<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Crazy Nothing Site</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: 'Orbitron', sans-serif;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: url('https://media.giphy.com/media/26AHONQ79FdWZhAI0/giphy.gif') no-repeat center center fixed;
      background-size: cover;
    }

    .container {
      backdrop-filter: blur(6px);
      background-color: rgba(0, 0, 0, 0.4);
      padding: 30px;
      border: 2px solid #00ffff;
      border-radius: 20px;
      box-shadow: 0 0 25px #00ffff;
    }

    h1 {
      font-size: 3em;
      text-shadow: 2px 2px #00ffff;
    }

    p {
      font-size: 1.5em;
      color: #ff00ff;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Welcome to My Crazy Nothing Site</h1>
    <p>This is literally a site about nothing... but it looks cool!</p>
  </div>
</body>
</html>
