<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Crazy Nothing Site</title>
    <style>
        /* Full-screen background setup */
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Background: can be a video or GIF */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        /* For a video background (optional) */
        .background video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* For a GIF background (optional) */
        .background img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }

        /* Crazy text styling */
        h1 {
            color: white;
            font-size: 5rem;
            text-align: center;
            animation: textAnimate 5s ease infinite;
            transform: rotate(-15deg);
            text-shadow: 5px 5px 15px rgba(0, 0, 0, 0.5);
            font-family: 'Courier New', Courier, monospace;
        }

        p {
            color: yellow;
            font-size: 2rem;
            text-align: center;
            animation: textAnimate 7s ease infinite;
            font-family: 'Courier New', Courier, monospace;
        }

        /* Animation for the text */
        @keyframes textAnimate {
            0% {
                transform: translateY(-20px) rotate(-15deg);
                opacity: 0;
            }
            50% {
                transform: translateY(0) rotate(0);
                opacity: 1;
            }
            100% {
                transform: translateY(20px) rotate(15deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <!-- Background section: Choose either a video or a GIF -->
    <div class="background">
        <!-- For Video Background -->
        <video autoplay muted loop>
            <source src="https://www.example.com/yourvideo.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <!-- OR For GIF Background -->
        <!-- <img src="https://www.example.com/yourbackground.gif" alt="background"> -->
    </div>

    <!-- Content section -->
    <div>
        <h1>Welcome to My Crazy Nothing Site!</h1>
        <p>Everything here is random and out of control!</p>
    </div>
</body>
</html>
